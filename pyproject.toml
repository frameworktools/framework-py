[project]
name = "framework-py"
version = "0.1.0.dev11"
description = "Structured data science projects: a data catalog, integrity tracking, caching, outputs, and AI guardrails"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Erik Westlund", email = "erik@table1.org" }]
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "jsonschema>=4.18",
    "keyring>=25",
    "pandas>=2.2",
    "pyarrow>=16",
    "PyYAML>=6.0",
    "ruamel-yaml>=0.18",
    "SecretStorage>=3.2; sys_platform == 'linux'",
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering",
    "Typing :: Typed",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.1"]
mysql = ["PyMySQL>=1.1"]
duckdb = ["duckdb>=1.0"]
sqlserver = ["pyodbc>=5.0"]
s3 = ["boto3>=1.34"]
excel = ["openpyxl>=3.1"]
spss = ["pyreadstat>=1.2"]
sas = ["pyreadstat>=1.2"]
rds = ["pyreadr>=0.5"]

[project.urls]
Homepage = "https://framework.pub"
Source = "https://github.com/frameworktools/framework-py"
Issues = "https://github.com/frameworktools/framework-py/issues"

[dependency-groups]
dev = [
    "boto3>=1.43.122",
    "duckdb>=2.0.0",
    "matplotlib>=3.11.2",
    "mypy>=1.11",
    "openpyxl>=3.1.5",
    "pandas-stubs>=2.2",
    "psycopg[binary]>=3.3.6",
    "pymysql>=1.2.3",
    "pyodbc>=5.3.0",
    "pyreadr>=0.5.9",
    "pyreadstat>=1.3.7",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "statsmodels>=0.14",
    "types-PyYAML>=6.0",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/framework"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "scripts", "parity.toml", "README.md", "LICENSE"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF", "PTH", "N"]

[tool.mypy]
strict = true
files = ["src", "scripts"]

[[tool.mypy.overrides]]
module = ["pyarrow", "pyarrow.*", "keyring", "keyring.*", "secretstorage", "jsonschema", "matplotlib", "matplotlib.*", "openpyxl", "pyreadr", "pyreadstat", "boto3", "botocore", "botocore.*", "pyodbc", "pymysql", "psycopg", "psycopg.*", "duckdb"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = ["-ra", "--strict-markers", "--import-mode=importlib"]
markers = [
    "integration: needs the servers in tests/integration/compose.yml (skipped when they are down)",
]
filterwarnings = ["error"]
