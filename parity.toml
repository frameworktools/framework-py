# Parity manifest: every function the R package exports, and its Python equivalent.
#
# status:
#   ported      same name and behavior
#   renamed     same behavior under a Python name
#   folded      covered by another Python function or idiom
#   r-only      no meaning outside R
#   deprecated  deprecated in R 2.0, so Python never adds it
#   omitted     could be ported, left out by decision
#
# python names a function in framework.__all__ for ported, renamed, and folded entries.
# scripts/check_parity.py checks this file against tests/shared/NAMESPACE.

