  common: [cache_remember, cache_get]
  names: [cache, cache_remember, cache_get, cache_list, cache_forget, cache_flush]

- id: database
  title: Database
  description: Database connections and queries
  common: [db_query, db_execute]
  names: [db_query, db_execute, db_connect, db_transaction, db_execute_file, db_copy_from, db_list, connections_list,
          db_drivers_status]

- id: ai
  title: AI
  description: AI assistant skills
  names: [ai_skills_update]

- id: types
  title: Errors and types
