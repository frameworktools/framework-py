# Reference categories for py.framework.pub, in order. The names follow R's
# inst/docs-export/categories.yml, so the two sites read alike. Every name in
# framework.__all__ must appear exactly once (tests/test_docs_site.py checks).
# `common` entries are listed first in their category.

- id: workflow
  title: Workflow
  description: Session setup, project settings, and global configuration
  common: [scaffold, settings, bootstrap]
  names: [scaffold, status, project_info, bootstrap, settings, settings_read, settings_write,
          spec_resolve, spec_check, configure_global, global_settings, config_dir, config_sync,
          load_settings_catalog, scratch_capture, scratch_clean, capture_output, now]

- id: data
  title: Data
  description: Data files and the data catalog
  common: [data_read, data_save, data_add, data_list]
  names: [data_read, data_save, data_add, data_list, data_info]

- id: packages
  title: Packages
  description: Package management with uv
  common: [package_add, packages_status]
  names: [package_add, package_set_add, package_sets_list, packages_list, packages_install,
          packages_restore, packages_snapshot, packages_update, packages_status]

- id: saving-work
  title: Saving work
  description: Tables, figures, models, reports, notebooks, and the results registry
  common: [save_table, save_figure]
  names: [save_table, save_figure, save_model, load_model, save_report, save_notebook, result_list]

- id: notebooks
  title: Notebooks and scripts
  description: Notebooks, scripts, presentations, stubs, and templates
  common: [make_notebook, make_script]
  names: [make_notebook, make_qmd, make_script, show_table, make_presentation, make_revealjs, stubs_list,
          stubs_path, stubs_publish, quarto_generate_all, quarto_regenerate, framework_template_path,
          read_framework_template, write_framework_template, reset_framework_template]

- id: project-management
  title: Project management
  description: Project creation, adoption, and the project registry
  common: [new_project, project_create]
  names: [new_project, new, project_create, project_create_from_layers, project_add_directory, project_root, project_path, path,
          project_list, project_register, project_unregister, tools_available, adopt,
          structure_import, cloud_register]

- id: publishing
  title: Publishing
  description: Output publishing and storage buckets
  common: [publish, publish_notebook]
  names: [publish, publish_notebook, publish_data, publish_dir, publish_list, storage_test]

- id: cloud
  title: Cloud
  description: Framework Cloud login, settings sync, and the integrity ledger
  common: [cloud_login, cloud_status]
